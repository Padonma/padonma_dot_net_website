<article class="bike-card">
  <a href="{{ .RelPermalink }}" class="card-link">
    {{ $images := .Resources.ByType "image" }}
    <div class="card-img-wrap{{ if not $images }} card-no-img{{ end }}">
      {{ if $images }}
        {{ $cover := index $images 0 }}
        <img
          src="{{ $cover.RelPermalink }}"
          alt="{{ .Title }}"
          loading="lazy"
          style="view-transition-name: {{ partial "view-transition-name.html" (dict "page" . "image" $cover) }};"
        >
      {{ else }}
        <span>NO IMAGE</span>
      {{ end }}
      <div class="card-overlay">
        <h3 class="card-header card-overlay-title card-header-available">{{ .Title }}</h3>
      </div>
    </div>
  </a>
</article>
