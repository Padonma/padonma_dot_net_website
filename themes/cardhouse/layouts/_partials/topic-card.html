<article class="topic-card">
  <a href="{{ .RelPermalink }}" class="card-link">
    {{ partial "hero-image.html" (dict
      "page" .
      "variant" "card"
      "loading" "lazy"
      "sizes" "(max-width: 720px) 100vw, (max-width: 1100px) 50vw, 33vw"
    ) }}
    <div class="card-overlay glass">
      <div class="card-copy">
        <h2 class="card-title">{{ .Title }}</h2>
        {{ with .Summary }}<p class="card-summary">{{ . }}</p>{{ end }}
      </div>
      {{ with .Params.topic_type }}<span class="card-label">{{ . }}</span>{{ end }}
    </div>
  </a>
</article>
