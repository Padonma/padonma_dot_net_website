[params]
  name = "Cardhaus"
  description = "An image-first Hugo theme for topic-centered knowledge sites"

  # These are build-time values used by the theme's responsive CSS. A site may
  # override either value under [params.cardhaus.breakpoints].
  [params.cardhaus.breakpoints]
    tablet = 1200
    mobile = 850

  # Relative carousel slugs resolve below this content path. Consumers with a
  # dedicated topic branch should override it; absolute page references work
  # independently of this setting.
  [params.cardhaus.carousel]
    pageRefPrefix = "/"

[module]
  [module.hugoVersion]
    extended = false
    min = "0.146.0"
