{{ define "main" }}
{{ partial "hero-carousel.html" . }}
<section class="topics-grid">
  <header class="section-header">
    <h1 class="section-title">// {{ .Title | upper }}</h1>
    <p class="section-sub">{{ len .RegularPages }} item{{ if ne (len .RegularPages) 1 }}s{{ end }}</p>
  </header>
  <div class="card-grid">
    {{ range .RegularPages.ByWeight }}
      {{ partial "topic-card.html" . }}
    {{ end }}
  </div>
</section>
{{ end }}
